name: Build Acheter POS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename Artifact
        run: |
          mkdir -p output/
          # Finds the compiled release APK and renames it cleanly
          cp app/build/outputs/apk/release/*.apk output/Acheter-POS.apk

      - name: Upload Acheter POS APK
        uses: actions/upload-artifact@v4
        with:
          name: Acheter-POS-v${{ github.run_number }}
          path: output/Acheter-POS.apk
          retention-days: 30
